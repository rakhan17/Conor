name: Build Conor for macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conor-macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build release binary
        run: swift build -c release

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Conor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/Conor "$APP/Contents/MacOS/Conor"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Conor</string>
            <key>CFBundleDisplayName</key><string>Conor</string>
            <key>CFBundleIdentifier</key><string>com.rakhan17.conor</string>
            <key>CFBundleExecutable</key><string>Conor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          hdiutil create -volname "Conor" -srcfolder "$APP" -ov -format UDZO "dist/Conor-macOS.dmg"
          hdiutil verify "dist/Conor-macOS.dmg"
          ls -lh "dist/Conor-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conor-macOS
          path: dist/Conor-macOS.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Conor-macOS.dmg
