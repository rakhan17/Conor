name: Build Conor for macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conor-macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Swift package manifest
        run: swift package dump-package > /tmp/conor-package.json
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f Package.swift
          test -f Sources/Conor/ConorApp.swift
          test -f README.md
          grep -q 'struct ConorApp: App' Sources/Conor/ConorApp.swift
          grep -q 'class ModelStore: ObservableObject' Sources/Conor/ConorApp.swift
          grep -q 'http://localhost:11434/api/chat' Sources/Conor/ConorApp.swift
          grep -q 'runs-on: macos-15' .github/workflows/build-macos.yml
          echo "Conor package manifest and required app components are present."

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build release binary
        run: swift build -c release

      - name: Package macOS app
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          APP="dist/Conor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp .build/release/Conor "$APP/Contents/MacOS/Conor"
          SPARKLE_FRAMEWORK="$(find .build -name Sparkle.framework -print -quit)"
          test -n "$SPARKLE_FRAMEWORK"
          ditto "$SPARKLE_FRAMEWORK" "$APP/Contents/Frameworks/Sparkle.framework"
          install_name_tool -add_rpath @executable_path/../Frameworks "$APP/Contents/MacOS/Conor"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0"; fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Conor</string>
            <key>CFBundleDisplayName</key><string>Conor</string>
            <key>CFBundleIdentifier</key><string>com.rakhan17.conor</string>
            <key>CFBundleExecutable</key><string>Conor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>SUFeedURL</key><string>https://github.com/rakhan17/Conor/releases/latest/download/appcast.xml</string>
            <key>SUPublicEDKey</key><string>${SPARKLE_PUBLIC_ED_KEY}</string>
            <key>SUEnableAutomaticChecks</key><true/>
            <key>SUScheduledCheckInterval</key><integer>86400</integer>
            <key>SUAutomaticallyUpdate</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          hdiutil create -volname "Conor" -srcfolder "$APP" -ov -format UDZO "dist/Conor-macOS.dmg"
          hdiutil verify "dist/Conor-macOS.dmg"
          ls -lh "dist/Conor-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conor-macOS
          path: dist/Conor-macOS.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          target_commitish: main
          name: Conor ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          make_latest: true
          generate_release_notes: true
          files: dist/Conor-macOS.dmg

      - name: Create and publish signed Sparkle update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_EDDSA_PRIVATE_KEY" || -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "Sparkle signing keys are not configured; publishing the DMG only."
            exit 0
          fi
          python3 -m pip install cryptography
          ditto -c -k --sequesterRsrc --keepParent dist/Conor.app dist/Conor-macOS.zip
          python3 scripts/create_appcast.py \
            --archive dist/Conor-macOS.zip \
            --version "${GITHUB_REF_NAME#v}" \
            --build "$GITHUB_RUN_NUMBER" \
            --tag "$GITHUB_REF_NAME" \
            --output dist/appcast.xml
          gh release upload "$GITHUB_REF_NAME" dist/Conor-macOS.zip dist/appcast.xml --clobber
